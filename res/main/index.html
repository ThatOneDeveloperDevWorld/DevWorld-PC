<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Launcher</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --text-color: #000000;
            --subtext-color: #333333;
            --box-bg: rgba(255, 255, 255, 0.85);
            --dropdown-bg: #ffffff;
            --border-color: #000000;
            --accent-lime: #39ff14;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            background-image: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), url('images/launcher.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; justify-content: center; align-items: center; position: relative;
        }

        /* Top Right Developer Logo Icon */
        .top-right-controls {
            position: absolute; top: 20px; right: 25px; display: flex; align-items: center; gap: 15px; z-index: 10;
        }
        .dev-logo-icon {
            width: 40px; height: 40px; border: 2px solid var(--border-color); border-radius: 8px;
            object-fit: cover; background: var(--box-bg); padding: 4px; box-shadow: 3px 3px 0px var(--border-color);
        }

        /* Center Launcher Container */
        .launcher-center {
            display: flex; flex-direction: column; align-items: center; gap: 25px; width: 100%; max-width: 450px; padding: 20px;
        }

        /* Logo in the Middle */
        .launcher-logo {
            width: 220px; height: auto; object-fit: contain;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.8));
        }

        /* Play Button (Neon Lime) */
        .open-btn {
            background: var(--accent-lime); border: 4px solid var(--border-color); border-radius: 12px;
            padding: 16px 0; width: 100%; font-size: 26px; font-weight: 900; cursor: pointer;
            box-shadow: 6px 6px 0px var(--border-color); color: var(--text-color) !important; letter-spacing: 1px;
            transition: transform 0.1s ease, box-shadow 0.1s ease; text-align: center;
        }
        .open-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0px var(--border-color); }

        /* Version Select below Play Button */
        .version-dropdown-container { position: relative; width: 100%; }
        .version-box {
            background: var(--box-bg); border: 3px solid var(--border-color); border-radius: 12px;
            padding: 12px 20px; font-size: 15px; font-weight: 900; color: var(--text-color);
            box-shadow: 4px 4px 0px var(--border-color); font-family: monospace; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; width: 100%;
        }
        .dropdown-menu {
            display: none; position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px;
            background: var(--dropdown-bg); border: 3px solid var(--border-color); border-radius: 10px;
            box-shadow: 4px 4px 0px var(--border-color); z-index: 10; max-height: 180px; overflow-y: auto;
        }
        .dropdown-item { padding: 10px 15px; font-size: 14px; font-weight: 800; cursor: pointer; border-bottom: 1px solid #ccc; color: var(--text-color); }
        .dropdown-item:hover { background: var(--accent-lime); color: #000; }

        /* Modal styling kept intact */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; }
        .modal-card { background: var(--box-bg); border: 4px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 380px; padding: 24px; box-shadow: 8px 8px 0px var(--border-color); display: flex; flex-direction: column; gap: 15px; position: relative; }
        .modal-title { font-size: 18px; font-weight: 900; margin: 0; text-align: center; text-transform: uppercase; }
        .input-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .input-label { font-size: 11px; font-weight: 800; color: var(--subtext-color); }
        .input-field { width: 100%; padding: 10px 12px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--dropdown-bg); color: var(--text-color); font-weight: 700; font-size: 14px; }
        .modal-btn { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; background: var(--accent-lime); color: #000; box-shadow: 3px 3px 0px var(--border-color); margin-top: 5px; }
        .close-modal { position: absolute; top: 10px; right: 14px; background: none; border: none; font-size: 18px; font-weight: 900; cursor: pointer; color: var(--text-color); }
    </style>
</head>
<body>

    <!-- Small Icon in Top Right -->
    <div class="top-right-controls">
        <img class="dev-logo-icon" src="../../cool/guys/devworlddevelopers/devworlddeveloperslogo.png" alt="Dev Logo">
    </div>

    <!-- Centered Launcher Flow -->
    <div class="launcher-center">
        <!-- Main Logo -->
        <img class="launcher-logo" src="../../required/assets/creditable/logos/devworlddevelopers/devworldlauncherlogo.png" alt="Dev World Logo">

        <!-- Play Button -->
        <button id="open-btn" class="open-btn">PLAY</button>

        <!-- Version Select Dropdown -->
        <div class="version-dropdown-container">
            <div class="version-box" id="version-selector-btn">
                <span>Version: <span id="current-version-text" style="color: #0055ff;">Loading...</span></span>
                <span>▲</span>
            </div>
            <div class="dropdown-menu" id="releases-dropdown"></div>
        </div>
    </div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let selectedVersion = "";
        let selectedAssets = [];
        let cachedReleasesData = [];

        const dropdownBtn = document.getElementById("version-selector-btn");
        const dropdownMenu = document.getElementById("releases-dropdown");

        dropdownBtn.onclick = (e) => {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === "block" ? "none" : "block";
        };
        window.onclick = () => { dropdownMenu.style.display = "none"; };

        async function loadReleases() {
            try {
                const response = await fetch('https://api.github.com/repos/ThatOneDeveloperDevWorld/DevWorld-PC/releases');
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    cachedReleasesData = data.map(rel => ({
                        tag: rel.tag_name,
                        body: rel.body,
                        assets: rel.assets.map(a => ({ name: a.name, url: a.browser_download_url }))
                    }));

                    selectedVersion = cachedReleasesData[0].tag;
                    selectedAssets = cachedReleasesData[0].assets;
                    document.getElementById("current-version-text").innerText = selectedVersion;

                    dropdownMenu.innerHTML = "";
                    cachedReleasesData.forEach(rel => {
                        const item = document.createElement("div");
                        item.className = "dropdown-item";
                        item.innerText = rel.tag;
                        item.onclick = (e) => {
                            e.stopPropagation();
                            selectedVersion = rel.tag;
                            selectedAssets = rel.assets;
                            document.getElementById("current-version-text").innerText = selectedVersion;
                            dropdownMenu.style.display = "none";
                        };
                        dropdownMenu.appendChild(item);
                    });
                } else {
                    document.getElementById("current-version-text").innerText = "v1.0.0";
                    selectedVersion = "v1.0.0";
                }
            } catch (err) {
                console.error("Failed to fetch releases from API:", err);
                document.getElementById("current-version-text").innerText = "v1.0.0";
                selectedVersion = "v1.0.0";
            }
        }
        loadReleases();

        document.getElementById("open-btn").onclick = async () => {
            if (!selectedVersion || !selectedAssets.length) {
                alert("Please select a valid version first!");
                return;
            }

            const playBtn = document.getElementById("open-btn");
            playBtn.innerText = "LAUNCHING...";

            try {
                const tauriInvoke = window.__TAURI__?.invoke || 
                                    window.__TAURI__?.core?.invoke || 
                                    (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);

                if (!tauriInvoke) {
                    throw new Error("Tauri invoke API is not available in this window environment.");
                }

                const entryPointPath = await tauriInvoke("launch_version", {
                    versionTag: selectedVersion,
                    assets: selectedAssets
                });

                const convertSrc = window.__TAURI__?.convertFileSrc || 
                                   window.__TAURI__?.core?.convertFileSrc;

                const assetUrl = convertSrc 
                    ? convertSrc(entryPointPath) 
                    : `http://asset.localhost/${entryPointPath}`;

                window.location.href = assetUrl;
            } catch (err) {
                alert("Error launching version: " + err.message || err);
                playBtn.innerText = "PLAY";
            }
        };
    </script>
</body>
</html>
