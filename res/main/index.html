<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Launcher</title>

    <!-- Google Fonts: Cherry Bomb One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --box-bg: #ffffff;
            --text-color: #000000;
            --subtext-color: #000000;
            --border-color: #000000;
            --nav-bg: #f4f4f4;
            --nav-active: #5ce1e6;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --box-bg: #1a1a1a;
            --text-color: #ffffff;
            --subtext-color: #ffffff;
            --border-color: #ffffff;
            --nav-bg: #1e1e1e;
            --nav-active: #5ce1e6;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Cherry Bomb One', cursive, sans-serif;
            letter-spacing: 1px; color: var(--text-color);
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled338_20260812133205.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/Untitled338_20260812133205.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #ffffff;
            transition: opacity 0.4s ease;
        }
        .loading-content { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .loading-logo { height: 560px; object-fit: contain; filter: drop-shadow(8px 8px 0px #000000); }
        .loading-status-text { font-size: 28px; color: #ffffff; text-shadow: 4px 4px 0px #000000; }

        /* Standalone Huge Top Logo (4x Scaled) */
        .top-logo-header {
            width: 100%; display: flex; justify-content: center;
            align-items: center; padding-top: 15px; z-index: 40;
        }
        .top-logo-img {
            height: 520px; object-fit: contain;
            filter: drop-shadow(8px 8px 0px #000000);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 85px; background: var(--nav-bg);
            border-top: 4px solid var(--border-color); display: flex;
            align-items: center; justify-content: space-between; padding: 0 35px;
            z-index: 50; box-shadow: 0px -6px 0px rgba(0,0,0,0.3);
        }

        .nav-left { display: flex; align-items: center; gap: 15px; }
        .nav-items { display: flex; gap: 15px; }
        .nav-item {
            background: var(--box-bg); border: 3px solid var(--border-color); color: var(--text-color);
            padding: 12px 22px; text-align: center; font-size: 16px;
            border-radius: 8px; cursor: pointer; 
            box-shadow: 4px 4px 0px var(--border-color);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
        }
        .nav-item:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); }
        .nav-item.active { background: #55ff55; color: #000000; }

        .nav-right { display: flex; align-items: center; gap: 15px; }

        /* Main Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 95px; position: relative; }
        .top-right-controls { position: absolute; top: 20px; right: 30px; display: flex; align-items: center; gap: 15px; z-index: 50; }
        
        .theme-btn { 
            background: var(--box-bg); border: 3px solid var(--border-color); border-radius: 8px; 
            cursor: pointer; padding: 8px; display: flex; box-shadow: 4px 4px 0px var(--border-color); 
        }
        .theme-btn img { width: 24px; height: 24px; }

        .play-row { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 650px; }
        .play-controls-group { display: flex; align-items: center; gap: 20px; justify-content: center; width: 100%; }

        .version-dropdown-container { position: relative; }
        .version-box {
            background: var(--box-bg); border: 4px solid var(--border-color); border-radius: 12px;
            padding: 18px 24px; font-size: 20px; color: var(--text-color);
            box-shadow: 6px 6px 0px var(--border-color); cursor: pointer;
            display: flex; align-items: center; gap: 20px;
        }
        .dropdown-menu {
            display: none; position: absolute; bottom: 100%; right: 0; margin-bottom: 10px;
            background: var(--box-bg); border: 4px solid var(--border-color); border-radius: 10px;
            width: 200px; box-shadow: 6px 6px 0px var(--border-color); z-index: 100; max-height: 200px; overflow-y: auto;
        }
        .dropdown-item { padding: 12px 18px; font-size: 16px; cursor: pointer; border-bottom: 2px solid var(--border-color); color: var(--text-color); }
        .dropdown-item:hover { background: #55ff55; color: #000000; }

        .path-box {
            background: var(--box-bg); border: 3px solid var(--border-color); border-radius: 10px;
            padding: 10px 18px; font-size: 13px; font-family: 'Segoe UI', sans-serif; font-weight: 800;
            display: flex; align-items: center; gap: 12px; cursor: pointer; box-shadow: 4px 4px 0px var(--border-color);
            color: var(--text-color);
        }

        .open-btn {
            background: #55ff55; border: 4px solid var(--border-color); border-radius: 12px;
            padding: 18px 70px; font-size: 32px; cursor: pointer;
            box-shadow: 6px 6px 0px var(--border-color); color: #000000 !important;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
        }
        .open-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0px var(--border-color); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; }
        .modal-card { background: var(--box-bg); border: 4px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 400px; padding: 28px; box-shadow: 8px 8px 0px var(--border-color); display: flex; flex-direction: column; gap: 18px; position: relative; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .modal-title { font-size: 22px; font-weight: 900; margin: 0; text-align: center; text-transform: uppercase; font-family: 'Cherry Bomb One', cursive; color: var(--text-color); }
        .input-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .input-label { font-size: 12px; font-weight: 900; color: var(--subtext-color); }
        .input-field { width: 100%; padding: 12px 14px; border: 3px solid var(--border-color); border-radius: 8px; background: var(--box-bg); color: var(--text-color); font-weight: 800; font-size: 15px; }
        .modal-btn { width: 100%; padding: 14px; border: 3px solid var(--border-color); border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; background: #55ff55; color: #000000; box-shadow: 4px 4px 0px var(--border-color); font-family: 'Cherry Bomb One', cursive; }
        .modal-toggle { background: none; border: none; color: var(--text-color); font-weight: 800; font-size: 13px; cursor: pointer; text-decoration: underline; }
        .error-msg { color: var(--text-color); font-size: 13px; font-weight: 900; margin: 0; min-height: 18px; text-align: center; }
        .close-modal { position: absolute; top: 12px; right: 16px; background: #55ff55; border: 2px solid var(--border-color); width: 28px; height: 28px; border-radius: 6px; font-size: 16px; font-weight: 900; cursor: pointer; color: #000000; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0px var(--border-color); }
    </style>
</head>
<body data-theme="dark">

    <!-- Loading Screen Preloader -->
    <div id="loading-screen">
        <div class="loading-content">
            <img src="https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/logo1.png" alt="Dev World Logo" class="loading-logo">
            <div id="loading-status" class="loading-status-text">Loading...</div>
        </div>
    </div>

    <!-- Standalone Huge Top Logo (4x Scaled) -->
    <div class="top-logo-header">
        <img src="https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/logo1.png" alt="Dev World Logo" class="top-logo-img">
    </div>

    <div class="top-right-controls">
        <button class="theme-btn" id="theme-toggle-btn" onclick="toggleTheme()">
            <img id="theme-icon" src="images/Light.png" alt="Toggle Theme">
        </button>
    </div>

    <div class="main-content">
        <div class="play-row">
            <div class="play-controls-group">
                <div class="version-dropdown-container">
                    <div class="version-box" id="version-selector-btn">
                        <span>Latest</span>
                        <span id="current-version-text" style="color: var(--text-color);">Loading...</span>
                        <span>▲</span>
                    </div>
                    <div class="dropdown-menu" id="releases-dropdown"></div>
                </div>

                <button id="open-btn" class="open-btn">PLAY</button>
            </div>

            <!-- Download Path Display -->
            <div class="path-box" onclick="selectDownloadFolder()">
                <span>DOWNLOAD PATH:</span>
                <span id="download-path-text" style="color: var(--text-color);">Default (Desktop)</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-left">
            <div class="nav-items">
                <button class="nav-item active">Play</button>
                <button class="nav-item" onclick="openReleasesModal()">Releases</button>
                <button class="nav-item" onclick="openSettingsModal()">Settings</button>
                <button class="nav-item" onclick="window.open('https://discord.gg/hDqN8MPTkj')">Community</button>
            </div>
        </div>

        <div class="nav-right">
            <button class="nav-item" id="account-nav-btn" onclick="openAuthModal()">
                <span id="account-btn-text">Sign In</span>
            </button>
        </div>
    </div>

    <!-- Auth Modal (Sign In / Sign Up) -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeAuthModal()">X</button>
            <h3 class="modal-title" id="modal-heading">Sign In</h3>
            <p class="error-msg" id="auth-error"></p>
            <div class="input-group" id="username-group" style="display: none;">
                <label class="input-label">USERNAME</label>
                <input type="text" id="signup-username" class="input-field" placeholder="Choose a username...">
            </div>
            <div class="input-group">
                <label class="input-label">EMAIL</label>
                <input type="email" id="auth-email" class="input-field" placeholder="Enter your email...">
            </div>
            <div class="input-group">
                <label class="input-label">PASSWORD</label>
                <input type="password" id="auth-password" class="input-field" placeholder="Enter your password...">
            </div>
            <button class="modal-btn" id="auth-submit-btn" onclick="handleAuthSubmit()">Sign In</button>
            <button class="modal-toggle" id="auth-switch-btn" onclick="toggleAuthMode()">Need an account? Sign up</button>
        </div>
    </div>

    <!-- Account Management Modal (Manage Username & Bio) -->
    <div class="modal-overlay" id="account-manager-modal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeAccountManagerModal()">X</button>
            <h3 class="modal-title">Account Settings</h3>
            <p class="error-msg" id="account-error"></p>
            <div class="input-group">
                <label class="input-label">DEV WORLD USERNAME</label>
                <input type="text" id="manage-username" class="input-field" placeholder="Update username...">
            </div>
            <div class="input-group">
                <label class="input-label">BIO</label>
                <textarea id="manage-bio" class="input-field" placeholder="Write a short bio..." rows="3" style="resize: none;"></textarea>
            </div>
            <button class="modal-btn" onclick="handleSaveAccountDetails()">Save Changes</button>
            <button class="modal-btn" onclick="handleSignOut()" style="background: #ff595e; color: #000000; margin-top: 5px;">Sign Out</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeSettingsModal()">X</button>
            <h3 class="modal-title">Settings</h3>
            <button class="modal-btn" onclick="closeSettingsModal()">Close</button>
        </div>
    </div>

    <!-- Releases Modal -->
    <div class="modal-overlay" id="releases-modal">
        <div class="modal-card" style="max-width: 450px;">
            <button class="close-modal" onclick="closeReleasesModal()">X</button>
            <h3 class="modal-title">Latest Release Notes</h3>
            <div id="releases-content" style="max-height: 250px; overflow-y: auto; font-size: 14px; font-weight: 700; line-height: 1.5; text-align: left; padding: 5px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--text-color);">
                Loading release notes...
            </div>
            <button class="modal-btn" onclick="closeReleasesModal()">Got It</button>
        </div>
    </div>

    <script type="module">
        // 1. Loading Screen Fade Logic & Windows Username Fetching via Tauri API
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const tauriInvoke = window.__TAURI__?.invoke || window.__TAURI__?.core?.invoke;
                if (tauriInvoke) {
                    const winUser = await tauriInvoke("get_windows_username").catch(() => null);
                    if (winUser) {
                        document.getElementById("download-path-text").innerText = `C:/Users/${winUser}/Desktop`;
                        localStorage.setItem("default_windows_user", winUser);
                    }
                }
            } catch (e) {
                console.log("Could not auto-fetch windows user directly, using fallback");
            }

            setTimeout(() => {
                const screen = document.getElementById('loading-screen');
                screen.style.opacity = '0';
                setTimeout(() => screen.remove(), 400);
            }, 1200);
        });

        // 2. Custom Download Path Selector
        window.selectDownloadFolder = async function() {
            try {
                const dialogPlugin = window.__TAURI__?.dialog || window.__TAURI_PLUGIN_DIALOG__;
                if (dialogPlugin && dialogPlugin.open) {
                    const selected = await dialogPlugin.open({ directory: true, multiple: false });
                    if (selected) {
                        localStorage.setItem("custom_download_path", selected);
                        document.getElementById("download-path-text").innerText = selected;
                    }
                } else {
                    const path = prompt("Set Custom Download Path:", "C:/Users/Desktop/DevWorld");
                    if (path) {
                        localStorage.setItem("custom_download_path", path);
                        document.getElementById("download-path-text").innerText = path;
                    }
                }
            } catch (err) {
                console.error("Failed to pick folder:", err);
            }
        };

        const savedPath = localStorage.getItem("custom_download_path");
        if (savedPath) { 
            document.getElementById("download-path-text").innerText = savedPath; 
        }

        // Firebase Configuration & Operations
        const firebaseConfig = {
            apiKey: "AIzaSyDlHHkVs9AVAAknCAMknG_dAYzAIU9eGSA",
            authDomain: "dev-world-c65f5.firebaseapp.com",
            projectId: "dev-world-c65f5",
            storageBucket: "dev-world-c65f5.firebasestorage.app",
            messagingSenderId: "961103609829",
            appId: "1:961103609829:web:ea87f9d0eb63dfde13790c"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let selectedVersion = "";
        let selectedAssets = [];
        let isSignUpMode = false;
        let cachedReleasesData = [];

        // Auth State Handler: Strictly queries Firestore for the Dev World username without email/Gmail fallbacks
        auth.onAuthStateChanged(async (user) => {
            const accountBtnText = document.getElementById("account-btn-text");
            if (user) {
                try {
                    let userDoc = await db.collection("users").doc(user.uid).get();
                    if (userDoc.exists && userDoc.data().username) {
                        accountBtnText.innerText = userDoc.data().username;
                    } else {
                        // Query users collection by email field
                        const querySnapshot = await db.collection("users").where("email", "==", user.email).get();
                        if (!querySnapshot.empty && querySnapshot.docs[0].data().username) {
                            accountBtnText.innerText = querySnapshot.docs[0].data().username;
                        } else {
                            accountBtnText.innerText = "Account";
                        }
                    }
                } catch (e) {
                    console.error("Error fetching Dev World username:", e);
                    accountBtnText.innerText = "Account";
                }
            } else {
                accountBtnText.innerText = "Sign In";
            }
        });

        window.openAuthModal = async function() {
            if (auth.currentUser) {
                const userDoc = await db.collection("users").doc(auth.currentUser.uid).get();
                if (userDoc.exists) {
                    document.getElementById("manage-username").value = userDoc.data().username || "";
                    document.getElementById("manage-bio").value = userDoc.data().bio || "";
                }
                document.getElementById("account-manager-modal").style.display = "flex";
            } else {
                document.getElementById("auth-modal").style.display = "flex";
            }
        };

        window.closeAuthModal = () => { document.getElementById("auth-modal").style.display = "none"; document.getElementById("auth-error").innerText = ""; };
        window.closeAccountManagerModal = () => { document.getElementById("account-manager-modal").style.display = "none"; document.getElementById("account-error").innerText = ""; };
        
        window.openSettingsModal = () => document.getElementById("settings-modal").style.display = "flex";
        window.closeSettingsModal = () => document.getElementById("settings-modal").style.display = "none";

        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            document.getElementById("modal-heading").innerText = isSignUpMode ? "Create Account" : "Sign In";
            document.getElementById("auth-submit-btn").innerText = isSignUpMode ? "Sign Up" : "Sign In";
            document.getElementById("auth-switch-btn").innerText = isSignUpMode ? "Already have an account? Sign in" : "Need an account? Sign up";
            document.getElementById("username-group").style.display = isSignUpMode ? "flex" : "none";
            document.getElementById("auth-error").innerText = "";
        };

        window.handleAuthSubmit = async function() {
            const email = document.getElementById("auth-email").value.trim();
            const password = document.getElementById("auth-password").value;
            const username = document.getElementById("signup-username").value.trim();
            const errorEl = document.getElementById("auth-error");
            errorEl.innerText = "";

            if (!email || !password || (isSignUpMode && !username)) {
                errorEl.innerText = "Please fill in all fields.";
                return;
            }

            try {
                if (isSignUpMode) {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection("users").doc(userCredential.user.uid).set({
                        username: username,
                        email: email,
                        bio: "",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
                closeAuthModal();
            } catch (err) {
                errorEl.innerText = err.message;
            }
        };

        window.handleSaveAccountDetails = async function() {
            const newUsername = document.getElementById("manage-username").value.trim();
            const newBio = document.getElementById("manage-bio").value.trim();
            const errorEl = document.getElementById("account-error");
            errorEl.innerText = "";

            if (!newUsername) {
                errorEl.innerText = "Username cannot be empty.";
                return;
            }

            try {
                const user = auth.currentUser;
                if (user) {
                    await db.collection("users").doc(user.uid).set({
                        username: newUsername,
                        bio: newBio,
                        email: user.email
                    }, { merge: true });
                    document.getElementById("account-btn-text").innerText = newUsername;
                    closeAccountManagerModal();
                }
            } catch (err) {
                errorEl.innerText = err.message;
            }
        };

        window.handleSignOut = async function() {
            await auth.signOut();
            closeAccountManagerModal();
        };

        window.toggleTheme = function() {
            const body = document.body;
            const themeIcon = document.getElementById("theme-icon");
            if (body.getAttribute("data-theme") === "dark") {
                body.setAttribute("data-theme", "light");
                themeIcon.src = "images/Dark.png";
            } else {
                body.setAttribute("data-theme", "dark");
                themeIcon.src = "images/Light.png";
            }
        };

        const dropdownBtn = document.getElementById("version-selector-btn");
        const dropdownMenu = document.getElementById("releases-dropdown");

        dropdownBtn.onclick = (e) => {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === "block" ? "none" : "block";
        };
        window.onclick = () => { dropdownMenu.style.display = "none"; };

        async function loadReleases() {
            try {
                const response = await fetch('https://api.github.com/repos/ThatOneDeveloperDevWorld/DevWorld-PC/releases');
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    cachedReleasesData = data.map(rel => ({
                        tag: rel.tag_name,
                        body: rel.body,
                        assets: rel.assets.map(a => ({ name: a.name, url: a.browser_download_url }))
                    }));

                    selectedVersion = cachedReleasesData[0].tag;
                    selectedAssets = cachedReleasesData[0].assets;
                    document.getElementById("current-version-text").innerText = selectedVersion;

                    dropdownMenu.innerHTML = "";
                    cachedReleasesData.forEach(rel => {
                        const item = document.createElement("div");
                        item.className = "dropdown-item";
                        item.innerText = rel.tag;
                        item.onclick = (e) => {
                            e.stopPropagation();
                            selectedVersion = rel.tag;
                            selectedAssets = rel.assets;
                            document.getElementById("current-version-text").innerText = selectedVersion;
                            dropdownMenu.style.display = "none";
                        };
                        dropdownMenu.appendChild(item);
                    });
                } else {
                    document.getElementById("current-version-text").innerText = "v1.0.0";
                    selectedVersion = "v1.0.0";
                }
            } catch (err) {
                console.error("Failed to fetch releases from API:", err);
                document.getElementById("current-version-text").innerText = "v1.0.0";
                selectedVersion = "v1.0.0";
            }
        }
        loadReleases();

        window.openReleasesModal = function() {
            const modal = document.getElementById("releases-modal");
            const contentEl = document.getElementById("releases-content");
            if (cachedReleasesData.length > 0) {
                const latest = cachedReleasesData[0];
                contentEl.innerHTML = `<strong>Version:</strong> ${latest.tag}<br><br><strong>Notes:</strong><br>${latest.body ? latest.body.replace(/\n/g, '<br>') : 'No notes provided.'}`;
            } else {
                contentEl.innerHTML = "No release notes found.";
            }
            modal.style.display = "flex";
        };

        window.closeReleasesModal = () => document.getElementById("releases-modal").style.display = "none";
                
        document.getElementById("open-btn").onclick = async () => {
            if (!selectedVersion || !selectedAssets.length) {
                alert("Please select a valid version first!");
                return;
            }

            const playBtn = document.getElementById("open-btn");
            playBtn.innerText = "LAUNCHING...";

            try {
                const tauriInvoke = window.__TAURI__?.invoke || 
                                    window.__TAURI__?.core?.invoke || 
                                    (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);

                if (!tauriInvoke) {
                    throw new Error("Tauri invoke API is not available in this window environment.");
                }

                const customPath = localStorage.getItem("custom_download_path") || "";

                const entryPointPath = await tauriInvoke("launch_version", {
                    versionTag: selectedVersion,
                    assets: selectedAssets,
                    downloadPath: customPath
                });

                const convertSrc = window.__TAURI__?.convertFileSrc || 
                                   window.__TAURI__?.core?.convertFileSrc;

                const assetUrl = convertSrc 
                    ? convertSrc(entryPointPath) 
                    : `http://asset.localhost/${entryPointPath}`;

                window.location.href = assetUrl;
            } catch (err) {
                alert("Error launching version: " + (err.message || err));
                playBtn.innerText = "PLAY";
            }
        };
    </script>
</body>
</html>
