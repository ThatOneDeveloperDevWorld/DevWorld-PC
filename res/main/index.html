<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dev World PC Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 30px;
        }
        h1 {
            color: #6366f1;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #9ca3af;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .release-card {
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .release-card h3 {
            margin-top: 0;
            color: #ffffff;
        }
        .release-body {
            color: #a1a1aa;
            font-size: 14px;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4f46e5;
        }
        button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        #loading {
            color: #9ca3af;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Dev World PC</h1>
    <p class="subtitle">Select a version below to launch</p>
    
    <div id="loading">Fetching available releases...</div>
    <div id="releases-container"></div>

    <script type="module">
        import { invoke, convertFileSrc } from '@tauri-apps/api/core';

        async function initLauncher() {
            const loadingEl = document.getElementById('loading');
            const container = document.getElementById('releases-container');

            try {
                const releases = await invoke('get_github_releases');
                loadingEl.style.display = 'none';

                if (!releases || releases.length === 0) {
                    container.innerHTML = '<p>No releases found on GitHub.</p>';
                    return;
                }

                releases.forEach(release => {
                    const card = document.createElement('div');
                    card.className = 'release-card';
                    card.innerHTML = `
                        <h3>${release.name} <span style="font-size: 12px; color: #9ca3af; font-weight: normal;">(${release.tag})</span></h3>
                        <div class="release-body">${release.body}</div>
                        <button id="launch-btn-${release.tag}">Launch Version</button>
                    `;
                    container.appendChild(card);

                    const btn = document.getElementById(`launch-btn-${release.tag}`);
                    btn.addEventListener('click', async () => {
                        try {
                            btn.disabled = true;
                            btn.innerText = 'Downloading & Caching...';

                            // 1. Tell Rust backend to download assets to cache/versionname/ and return the path
                            const entryPointPath = await invoke('launch_version', {
                                versionTag: release.tag,
                                assets: release.assets
                            });

                            btn.innerText = 'Launching...';

                            // 2. Convert system path to safe Tauri asset protocol URL
                            const assetUrl = convertFileSrc(entryPointPath);

                            // 3. Navigate window directly to the cached version's index.html
                            window.location.href = assetUrl;

                        } catch (err) {
                            console.error("Launch failed:", err);
                            alert("Error launching version: " + err);
                            btn.disabled = false;
                            btn.innerText = 'Launch Version';
                        }
                    });
                });
            } catch (err) {
                loadingEl.innerText = 'Failed to load releases: ' + err;
            }
        }

        initLauncher();
    </script>
</body>
</html>
