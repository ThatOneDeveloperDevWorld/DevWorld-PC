<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev World - Launcher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; font-family: 'Cherry Bomb One', cursive, sans-serif;
            letter-spacing: 1px; color: #000000;
            display: flex; position: relative;
        }

        /* Fullscreen launcher.png background image */
        .launcher-bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Black Tint Overlay Layer */
        .launcher-tint-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4); /* Black tint */
            z-index: 2;
            pointer-events: none;
        }

        /* Left Navigation Bar (Matches Mockup) */
        .sidebar-left {
            width: 220px; height: 100%;
            border-right: 4px solid #000000;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 25px; padding: 20px 15px;
            z-index: 10;
        }

        .sidebar-btn {
            width: 100%; max-width: 170px; padding: 16px 10px;
            background: #ffffff; border: 4px solid #000000;
            border-radius: 12px; font-size: 18px; color: #000000;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            text-align: center; cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .sidebar-btn:active {
            transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000000;
        }

        /* Center Section (Logo & Play Button) */
        .main-center {
            flex: 1; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            z-index: 10;
        }

        .center-logo {
            max-width: 480px; width: 70%; height: auto;
            margin-bottom: 30px; filter: drop-shadow(6px 6px 0px #000000);
        }

        .play-btn {
            width: 260px; padding: 18px; background: #ffffff;
            border: 4px solid #000000; border-radius: 16px;
            font-size: 36px; color: #000000;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            cursor: pointer; box-shadow: 6px 6px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-align: center;
        }
        .play-btn:active {
            transform: translate(3px, 3px); box-shadow: 3px 3px 0px #000000;
        }

        /* Bottom Control Box (Version Selector) */
        .bottom-version-box {
            position: absolute; bottom: 25px; left: 245px;
            display: flex; align-items: center; gap: 15px; z-index: 20;
        }

        .version-control-card {
            background: #ffffff; border: 4px solid #000000;
            border-radius: 12px; padding: 10px 16px; font-size: 18px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 4px 4px 0px #000000; position: relative;
        }

        .select-ver-btn {
            background: #cceecc; border: 2px solid #000000;
            border-radius: 6px; padding: 4px 10px; font-size: 12px;
            font-family: 'Cherry Bomb One', cursive, sans-serif;
            cursor: pointer; box-shadow: 2px 2px 0px #000000;
        }

        .dropdown-menu {
            display: none; position: absolute; bottom: 115%; left: 0;
            background: #ffffff; border: 4px solid #000000;
            border-radius: 10px; width: 220px; box-shadow: 4px 4px 0px #000000;
            z-index: 100; max-height: 180px; overflow-y: auto;
        }
        .dropdown-item {
            padding: 10px; font-size: 15px; cursor: pointer;
            border-bottom: 2px solid #000000; color: #000000;
        }
        .dropdown-item:hover { background: #55ff55; }

        .launcher-version-tag {
            position: absolute; bottom: 15px; right: 20px;
            font-size: 13px; color: #ffffff; opacity: 0.8; z-index: 20;
            text-shadow: 2px 2px 0px #000000;
        }

        /* Modals */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px); z-index: 200;
            justify-content: center; align-items: center;
        }
        .modal-card {
            background: #ffffff; border: 4px solid #000000;
            border-radius: 16px; width: 90%; max-width: 420px;
            padding: 24px; box-shadow: 8px 8px 0px #000000;
            display: flex; flex-direction: column; gap: 15px;
            position: relative; text-align: center;
        }
        .close-modal {
            position: absolute; top: 10px; right: 12px;
            background: #ff595e; border: 2px solid #000000;
            border-radius: 6px; width: 26px; height: 26px;
            cursor: pointer; font-family: 'Cherry Bomb One', cursive;
        }

        .install-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #f4f4f4; border: 2px solid #000000; padding: 10px;
            border-radius: 8px; margin-bottom: 8px; font-size: 16px;
        }
        .del-btn {
            background: #ff595e; color: #fff; border: 2px solid #000000;
            border-radius: 6px; padding: 4px 8px; font-size: 12px;
            cursor: pointer; font-family: 'Cherry Bomb One', cursive;
        }

        .spinoff-card {
            display: flex; flex-direction: column; align-items: center;
            border: 3px solid #000000; border-radius: 10px; padding: 12px;
            background: #f8f8f8; gap: 8px;
        }
        .spinoff-img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 6px; }
        .coming-soon-badge {
            background: #ffb703; color: #000000; border: 2px solid #000000;
            padding: 4px 10px; border-radius: 12px; font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Background Image & Black Tint Overlay -->
    <img src="images/launcher.png" alt="Launcher Background" class="launcher-bg-image">
    <div class="launcher-tint-overlay"></div>

    <!-- Left Navigation Bar -->
    <div class="sidebar-left">
        <button class="sidebar-btn" onclick="openInstallationsModal()">INSTALLATIONS</button>
        <button class="sidebar-btn" onclick="openSpinoffsModal()">SPINOFFS</button>
        <button class="sidebar-btn" onclick="openDiscord()">DISCORD</button>
    </div>

    <!-- Main Center Area -->
    <div class="main-center">
        <img src="https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/logo1.png" alt="Dev World Logo" class="center-logo" onerror="this.src='Devworldlogobeta.png'">
        <button id="play-btn" class="play-btn">PLAY</button>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-version-box">
        <div class="version-control-card">
            <span id="current-version-text">Loading...</span>
            <button class="select-ver-btn" id="version-selector-btn">SELECT VERSION</button>
            <div class="dropdown-menu" id="releases-dropdown"></div>
        </div>
    </div>

    <div class="launcher-version-tag">Launcher v1.0.0</div>

    <!-- Installations Modal -->
    <div class="modal-overlay" id="installations-modal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeInstallationsModal()">X</button>
            <h3 style="margin: 0; font-size: 22px;">INSTALLED VERSIONS</h3>
            <div id="installations-list" style="max-height: 220px; overflow-y: auto; text-align: left; padding: 5px;"></div>
        </div>
    </div>

    <!-- Spinoffs Modal -->
    <div class="modal-overlay" id="spinoffs-modal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeSpinoffsModal()">X</button>
            <h3 style="margin: 0; font-size: 22px;">SPINOFFS</h3>
            <div class="spinoff-card">
                <img src="images/spinoffs/devworldthegame.png" alt="Dev World The Game" class="spinoff-img" onerror="this.src='https://raw.githubusercontent.com/ThatOneDeveloperDevWorld/devworldsource/main/screenlogin1.png'">
                <div style="font-size: 18px;">Dev World The Game</div>
                <div class="coming-soon-badge">COMING SOON</div>
            </div>
        </div>
    </div>

    <script type="module">
        let selectedVersion = "";
        let selectedAssets = [];
        let cachedReleasesData = [];

        const dropdownBtn = document.getElementById("version-selector-btn");
        const dropdownMenu = document.getElementById("releases-dropdown");

        dropdownBtn.onclick = (e) => {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === "block" ? "none" : "block";
        };
        window.onclick = () => { dropdownMenu.style.display = "none"; };

        async function loadReleases() {
            try {
                const response = await fetch('https://api.github.com/repos/ThatOneDeveloperDevWorld/DevWorld-PC/releases');
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    cachedReleasesData = data.map(rel => ({
                        tag: rel.tag_name,
                        assets: rel.assets.map(a => ({ name: a.name, url: a.browser_download_url }))
                    }));

                    selectedVersion = cachedReleasesData[0].tag;
                    selectedAssets = cachedReleasesData[0].assets;
                    document.getElementById("current-version-text").innerText = selectedVersion;

                    dropdownMenu.innerHTML = "";
                    cachedReleasesData.forEach(rel => {
                        const item = document.createElement("div");
                        item.className = "dropdown-item";
                        item.innerText = rel.tag;
                        item.onclick = (e) => {
                            e.stopPropagation();
                            selectedVersion = rel.tag;
                            selectedAssets = rel.assets;
                            document.getElementById("current-version-text").innerText = selectedVersion;
                            dropdownMenu.style.display = "none";
                        };
                        dropdownMenu.appendChild(item);
                    });
                } else {
                    document.getElementById("current-version-text").innerText = "v0.2.0";
                    selectedVersion = "v0.2.0";
                }
            } catch (err) {
                console.error("Failed to fetch GitHub releases:", err);
                document.getElementById("current-version-text").innerText = "v0.2.0";
                selectedVersion = "v0.2.0";
            }
        }
        loadReleases();

        // Launch Command Integration
        document.getElementById("play-btn").onclick = async () => {
            const playBtn = document.getElementById("play-btn");
            playBtn.innerText = "LAUNCHING...";

            try {
                const tauriInvoke = window.__TAURI__?.invoke || window.__TAURI__?.core?.invoke;
                if (!tauriInvoke) {
                    throw new Error("Tauri IPC bridge unavailable.");
                }

                const entryPointPath = await tauriInvoke("launch_version", {
                    versionTag: selectedVersion,
                    assets: selectedAssets
                });

                const convertSrc = window.__TAURI__?.convertFileSrc || window.__TAURI__?.core?.convertFileSrc;
                const assetUrl = convertSrc ? convertSrc(entryPointPath) : `http://asset.localhost/${entryPointPath}`;
                window.location.href = assetUrl;
            } catch (err) {
                alert("Launch error: " + (err.message || err));
                playBtn.innerText = "PLAY";
            }
        };

        // Installations Logic
        window.openInstallationsModal = async function() {
            const modal = document.getElementById("installations-modal");
            const listEl = document.getElementById("installations-list");
            listEl.innerHTML = "Loading...";

            try {
                const tauriInvoke = window.__TAURI__?.invoke || window.__TAURI__?.core?.invoke;
                if (tauriInvoke) {
                    const installed = await tauriInvoke("get_installed_versions");
                    if (installed.length === 0) {
                        listEl.innerHTML = "<div style='text-align:center;'>No versions downloaded yet.</div>";
                    } else {
                        listEl.innerHTML = "";
                        installed.forEach(ver => {
                            const item = document.createElement("div");
                            item.className = "install-item";
                            item.innerHTML = `<span>${ver}</span>`;
                            const delBtn = document.createElement("button");
                            delBtn.className = "del-btn";
                            delBtn.innerText = "DELETE";
                            delBtn.onclick = () => deleteVersion(ver);
                            item.appendChild(delBtn);
                            listEl.appendChild(item);
                        });
                    }
                } else {
                    listEl.innerHTML = "Tauri API not connected.";
                }
            } catch (e) {
                listEl.innerHTML = "Error fetching installations.";
            }

            modal.style.display = "flex";
        };

        window.deleteVersion = async function(ver) {
            if (!confirm(`Delete ${ver}?`)) return;
            try {
                const tauriInvoke = window.__TAURI__?.invoke || window.__TAURI__?.core?.invoke;
                if (tauriInvoke) {
                    await tauriInvoke("delete_version", { versionTag: ver });
                    openInstallationsModal();
                }
            } catch (err) {
                alert("Failed to delete: " + err);
            }
        };

        window.closeInstallationsModal = () => document.getElementById("installations-modal").style.display = "none";

        // Spinoffs Modal Controls
        window.openSpinoffsModal = () => document.getElementById("spinoffs-modal").style.display = "flex";
        window.closeSpinoffsModal = () => document.getElementById("spinoffs-modal").style.display = "none";

        // Discord Button Handler (Opens System Browser)
        window.openDiscord = async function() {
            try {
                const tauriInvoke = window.__TAURI__?.invoke || window.__TAURI__?.core?.invoke;
                if (tauriInvoke) {
                    await tauriInvoke("open_discord_link");
                } else {
                    window.open('https://discord.gg/hDqN8MPTkj', '_blank');
                }
            } catch (e) {
                window.open('https://discord.gg/hDqN8MPTkj', '_blank');
            }
        };
    </script>
</body>
</html>
